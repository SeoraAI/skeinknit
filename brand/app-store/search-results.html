<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--cream:#FAF6F0;--card:#F3ECE2;--ink:#2B1F18;--taupe:#9A8878;--chestnut:#8A4B2F;--clay:#C5714A;--line:rgba(43,31,24,.09)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1280px;overflow:hidden}
body{font-family:Inter,sans-serif;color:var(--ink);
  background:radial-gradient(1200px 900px at 78% 52%,#EFE3D3 0%,rgba(239,227,211,0) 70%),
             linear-gradient(180deg,var(--cream) 0%,#F6EFE6 100%);position:relative}
.copy{position:absolute;left:150px;top:0;bottom:0;width:640px;display:flex;flex-direction:column;justify-content:center;gap:56px}
.lockup{width:420px}
h1{font-weight:300;font-size:96px;line-height:1.04;letter-spacing:-.025em}
h1 em{font-style:normal;color:var(--chestnut)}
.rule{width:72px;height:2px;background:var(--clay)}
.sub{font-size:30px;line-height:1.45;font-weight:400;color:#5d4b3f;max-width:540px}
.tag{font-size:18px;font-weight:500;letter-spacing:.32em;text-transform:uppercase;color:var(--taupe)}
.dev{position:absolute;filter:drop-shadow(0 40px 60px rgba(43,31,24,.18)) drop-shadow(0 8px 16px rgba(43,31,24,.10))}
.dev img{display:block;width:100%;height:100%;object-fit:cover}
/* Mac */
.mac{left:930px;top:200px;width:900px}
.mac .lid{background:#1c1714;border-radius:26px;padding:22px 22px 26px;aspect-ratio:1600/1000;box-sizing:content-box;width:calc(100% - 44px)}
.mac .lid .s{width:100%;height:100%;border-radius:6px;overflow:hidden}
.mac .base{height:24px;margin:0 -60px;background:linear-gradient(#d9d1c8,#b9afa4);border-radius:0 0 22px 22px;position:relative}
.mac .base:before{content:"";position:absolute;left:50%;top:0;width:150px;height:9px;transform:translateX(-50%);background:#a99f94;border-radius:0 0 10px 10px}
/* iPad */
.ipad{left:830px;top:470px;width:470px;aspect-ratio:1050/1400;background:#1c1714;border-radius:40px;padding:18px}
.ipad .s{width:100%;height:100%;border-radius:24px;overflow:hidden}
/* iPhone */
.iphone{left:1300px;top:600px;width:270px;aspect-ratio:414/900;background:#1c1714;border-radius:46px;padding:10px}
.iphone .s{width:100%;height:100%;border-radius:37px;overflow:hidden;position:relative}
.iphone .island{position:absolute;top:12px;left:50%;width:84px;height:24px;border-radius:99px;background:#0b0a09;transform:translateX(-50%)}
</style></head>
<body>
  <div class="copy">
    <img class="lockup" src="../skein-lockup-horizontal-ink.svg" alt="Skein">
    <h1>From idea<br>to <em>every size.</em></h1>
    <div class="rule"></div>
    <p class="sub">Design a sweater, grade it across sizes, and knit it row by row.</p>
    <p class="tag">iPhone · iPad · Mac</p>
  </div>
  <div class="dev mac"><div class="lid"><div class="s"><img src="../../img/app/mac-grade-results.jpg"></div></div><div class="base"></div></div>
  <div class="dev ipad"><div class="s"><img src="../../img/app/ipad13-grade-construction.jpg"></div></div>
  <div class="dev iphone"><div class="s"><img src="../../img/app/iphone-knit.jpg"><div class="island"></div></div></div>
</body></html>
